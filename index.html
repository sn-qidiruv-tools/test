<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1322">
<title>PON qidiruv</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<style>
:root{
  --bg:#f2f5f9; --surface:#ffffff; --surface2:#eef2f7; --line:#dde4ee;
  --text:#0f1b2d; --muted:#5d6b82; --accent:#0a7cff; --accent2:#00b8a9;
  --accent-soft:#e3f0ff; --ok:#12a150; --ok-soft:#e1f6e9; --warn:#c77700; --warn-soft:#fff2db;
  --bad:#d63a3a; --bad-soft:#fde8e8; --shadow:0 1px 2px rgba(15,27,45,.06),0 8px 24px rgba(15,27,45,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0a101d; --surface:#111a2c; --surface2:#17223a; --line:#223250;
    --text:#e8eef9; --muted:#8fa0bd; --accent:#4da3ff; --accent2:#2fd6c5;
    --accent-soft:#12315c; --ok:#3ddc84; --ok-soft:#10301f; --warn:#ffb547; --warn-soft:#3a2a0c;
    --bad:#ff6b6b; --bad-soft:#3d1717; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 500px at 10% -10%,var(--accent-soft),transparent 60%),radial-gradient(700px 500px at 110% 110%,rgba(0,184,169,.14),transparent 60%),var(--bg)}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 24px 24px;box-shadow:var(--shadow);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px rgba(10,124,255,.35);margin-bottom:18px}
.logo svg{width:30px;height:30px}
.login-card h1{margin:0 0 4px;font-size:22px;letter-spacing:-.3px}
.login-card p{margin:0 0 22px;color:var(--muted)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.6px}
.input{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);outline:none;transition:border .2s,box-shadow .2s,background .2s}
.input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:12px;font-weight:600;transition:transform .12s,filter .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn-primary{width:100%;color:#fff;background:linear-gradient(135deg,var(--accent),#2a5bff);box-shadow:0 8px 18px rgba(10,124,255,.3);margin-top:6px}
.btn-primary:disabled{opacity:.6}
.btn-ghost{background:var(--surface2);border:1px solid var(--line)}
.err{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:14px}

/* ---------- Loader ---------- */
#loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:var(--bg);animation:fade .3s both}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:rot .8s linear infinite}
.loader-box{text-align:center;max-width:300px;color:var(--muted)}
.loader-box b{display:block;color:var(--text);font-size:16px;margin-bottom:2px}

/* ---------- App ---------- */
#app{max-width:760px;margin:0 auto;padding:0 14px 90px}
.top{position:sticky;top:0;z-index:20;margin:0 -14px;padding:12px 14px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;margin:0;box-shadow:none}
.brand .logo svg{width:22px;height:22px}
.brand b{display:block;font-size:16px;letter-spacing:-.2px}
.brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted);transition:.15s}
.icon-btn:active{transform:scale(.92)}
.seg{display:flex;gap:4px;padding:4px;margin-top:10px;border-radius:13px;background:var(--surface2);border:1px solid var(--line)}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);transition:.2s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg button.on.acc{color:var(--accent)}
.stats{display:flex;gap:8px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--text)}
.chip.tag{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.searchbox{position:relative;margin:12px 0}
.searchbox svg{position:absolute;left:14px;top:14px;color:var(--muted);pointer-events:none}
.searchbox .input{padding-left:44px;height:50px;font-size:16px;background:var(--surface);box-shadow:var(--shadow)}
.searchbox .clear{position:absolute;right:6px;top:6px;width:38px;height:38px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.sec-title{margin:18px 2px 8px;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.olt-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px}
.olt-item:active{transform:scale(.99)}
.olt-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.olt-name{flex:1;min-width:0;font-weight:600;word-break:break-word;font-size:14px}
.olt-name small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}
.count{min-width:34px;padding:3px 9px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:13px;text-align:center}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;padding:8px 4px;margin-top:6px}
.olt-head{padding:14px;margin:4px 0 10px}
.olt-head h2{margin:0 0 6px;font-size:15px;word-break:break-word}
.port-block{margin-bottom:10px;overflow:hidden}
.port-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--line)}
.port-head span{font-family:var(--mono);font-weight:700;font-size:15px}
.port-head em{font-style:normal;font-size:12px;color:var(--muted)}
.dev{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.dev:last-child{border-bottom:0}
.dev-main{flex:1;min-width:0}
.ser{font-family:var(--mono);font-weight:700;font-size:15.5px;letter-spacing:.3px;word-break:break-all}
.dates{font-size:12px;color:var(--muted);margin-top:2px}
.copy{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--surface2)}
.copy.done{color:var(--ok);background:var(--ok-soft)}

/* serial result */
.res{padding:16px;margin-bottom:12px}
.res-top{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:700;font-size:12px;background:var(--ok-soft);color:var(--ok)}
.kv{display:grid;grid-template-columns:100px 1fr;gap:6px 10px;align-items:baseline}
.kv dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kv dd{margin:0;word-break:break-word}
.big{font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:.4px;word-break:break-all}
.res .row2{display:flex;gap:10px;align-items:center;justify-content:space-between}
.empty{padding:28px 20px;text-align:center;animation:rise .4s both}
.empty .ei{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;margin:0 auto 12px;background:var(--warn-soft);color:var(--warn)}
.empty .ei svg{width:30px;height:30px}
.empty h3{margin:0 0 6px;font-size:18px}
.empty p{margin:0;color:var(--muted)}
.hint{padding:26px 18px;text-align:center;color:var(--muted)}
mark{background:var(--warn-soft);color:inherit;border-radius:4px;padding:0 1px}

/* admin fab + modal */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;height:52px;padding:0 20px;border-radius:16px;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 10px 26px rgba(10,124,255,.4);display:flex;align-items:center;gap:8px}
.fab:active{transform:scale(.95)}
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(5,10,20,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
.modal{width:100%;max-width:520px;background:var(--surface);border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.2,.8,.2,1) both;max-height:92vh;overflow:auto}
@media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:22px}}
.modal h3{margin:0 0 4px;font-size:19px}
.modal p{margin:0 0 14px;color:var(--muted)}
.drop{display:block;padding:22px 14px;border:2px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted);cursor:pointer;transition:.2s;background:var(--surface2)}
.drop:hover,.drop.on{border-color:var(--accent);color:var(--accent)}
.drop b{display:block;color:var(--text);margin-top:6px;word-break:break-all}
.sum{margin:14px 0;padding:12px 14px;border-radius:14px;background:var(--surface2);display:grid;gap:6px}
.sum div{display:flex;justify-content:space-between}
.sum.bad{background:var(--bad-soft);color:var(--bad)}
.warnbox{margin:12px 0;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.mrow{display:flex;gap:10px;margin-top:14px}
.mrow .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;padding:11px 16px;border-radius:12px;background:#0f1b2d;color:#fff;font-size:14px;box-shadow:var(--shadow);animation:rise .3s both;max-width:90vw;text-align:center}
.toast.ok{background:#0e8a47}.toast.bad{background:#c43030}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
@media(min-width:900px){#app{max-width:900px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="hidden">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg></div>
    <h1>PON qidiruv</h1>
    <p>Tizimga kirish uchun login va parolni kiriting</p>
    <div class="field"><label for="lg">Login</label><input class="input" id="lg" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label for="ps">Parol</label><input class="input" id="ps" name="password" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="loginBtn" type="submit">Kirish</button>
    <div class="err hidden" id="loginErr"></div>
  </form>
</div>

<!-- LOADER -->
<div id="loader" class="hidden">
  <div class="spin"></div>
  <div class="loader-box"><b id="loaderTitle">Ma'lumotlar yuklanmoqda…</b><span id="loaderSub">Iltimos, bir oz kuting</span></div>
  <button class="btn btn-ghost hidden" id="retryBtn">Qayta urinish</button>
  <button class="btn btn-ghost hidden" id="loaderOut">Chiqish</button>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="top">
    <div class="top-row">
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg></div>
        <div><b>PON qidiruv</b><small id="who"></small></div>
      </div>
      <button class="icon-btn" id="refreshBtn" title="Yangilash" aria-label="Yangilash"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg></button>
      <button class="icon-btn" id="logoutBtn" title="Chiqish" aria-label="Chiqish"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
    <div class="seg hidden" id="distSeg"></div>
    <div class="seg" id="modeSeg">
      <button data-m="olt" class="on acc">OLT bo'yicha</button>
      <button data-m="serial">Seriya bo'yicha</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div id="view"></div>
</div>

<button class="fab hidden" id="fab"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>Bazani yangilash</button>
<div id="modalHost"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
var API = 'https://script.google.com/macros/s/AKfycbyaupk9Yy0niESBp1vEFWgMT9W6QHhEZ953TIDl67rdcl3XQkVd_stbN12sAd0aKN2l/exec';
var HEADERS = ['Обнаружена','Последний раз','OLT','Порт','Серийный номер'];
var DIST_NAME = {buxoro:'Buxoro tuman', kogon:'Kogon tuman'};

var $ = function(id){return document.getElementById(id)};
var S = {auth:null, user:null, rows:[], updatedAt:'', updatedBy:'', dist:'all', mode:'olt', olt:null, oltQ:'', portQ:'', serQ:''};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function show(id,on){$(id).classList.toggle('hidden',!on)}
function toast(msg,type){var t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},3200)}

/* ---------- API ---------- */
function call(payload){
  var body = JSON.stringify(Object.assign({}, S.auth, payload));
  var ctrl = new AbortController(); var to = setTimeout(function(){ctrl.abort()}, 60000);
  return fetch(API,{method:'POST',body:body,signal:ctrl.signal,redirect:'follow'})
    .then(function(r){if(!r.ok) throw new Error('Server javob bermadi ('+r.status+')'); return r.json()})
    .then(function(j){clearTimeout(to); return j})
    .catch(function(e){clearTimeout(to); throw new Error(e.name==='AbortError'?'Vaqt tugadi, internetni tekshiring':(e.message||'Tarmoq xatosi'))});
}

/* ---------- Login ---------- */
$('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  var l=$('lg').value.trim(), p=$('ps').value;
  if(!l||!p) return;
  var b=$('loginBtn'); b.disabled=true; b.textContent='Tekshirilmoqda…'; show('loginErr',false);
  S.auth={login:l,parol:p};
  call({action:'login'}).then(function(j){
    if(!j.ok){throw new Error(j.error||'Kirib bo\'lmadi')}
    lsSet('pon_auth',JSON.stringify(S.auth));
    S.user=j.user; loadData();
  }).catch(function(err){
    S.auth=null; $('loginErr').textContent=err.message; show('loginErr',true);
  }).then(function(){b.disabled=false;b.textContent='Kirish'});
});

function logout(){
  lsDel('pon_auth'); S.auth=null; S.user=null; S.rows=[];
  show('app',false); show('fab',false); show('loader',false); show('login',true); $('ps').value='';
}
$('logoutBtn').onclick=logout; $('loaderOut').onclick=logout;
$('refreshBtn').onclick=function(){loadData(true)};
$('retryBtn').onclick=function(){loadData()};

/* ---------- Data ---------- */
function loadData(soft){
  if(!soft){
    show('login',false); show('app',false); show('loader',true);
    $('loaderTitle').textContent='Ma\'lumotlar yuklanmoqda…'; $('loaderSub').textContent='Iltimos, bir oz kuting';
    show('retryBtn',false); show('loaderOut',false); document.querySelector('#loader .spin').classList.remove('hidden');
  } else { $('refreshBtn').style.opacity='.5' }
  return call({action:'data'}).then(function(j){
    if(!j.ok) throw new Error(j.error||'Ma\'lumot olinmadi');
    S.user=j.user; S.updatedAt=j.updatedAt; S.updatedBy=j.updatedBy;
    var rows=[]; ['buxoro','kogon'].forEach(function(d){
      (j.data[d]||[]).forEach(function(r){rows.push({d:d,obn:r[0],last:r[1],olt:r[2],port:r[3],ser:r[4],key:norm(r[4])})});
    });
    S.rows=rows;
    if(S.user.role!=='admin') S.dist=S.user.tuman||'none'; else if(!soft) S.dist='all';
    S.olt=null; S.oltQ=''; S.portQ=''; S.serQ='';
    show('loader',false); show('app',true); show('fab',S.user.role==='admin');
    buildShell(); render();
    if(soft) toast('Ma\'lumotlar yangilandi','ok');
  }).catch(function(err){
    if(soft){toast(err.message,'bad')}
    else{
      document.querySelector('#loader .spin').classList.add('hidden');
      $('loaderTitle').textContent='Yuklab bo\'lmadi'; $('loaderSub').textContent=err.message;
      show('retryBtn',true); show('loaderOut',true);
    }
  }).then(function(){$('refreshBtn').style.opacity=''});
}

/* ---------- Helpers ---------- */
function norm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9А-Я]/g,'')}
function scoped(){return S.rows.filter(function(r){return S.dist==='all'||r.d===S.dist})}
function natKey(p){return String(p).split('/').map(function(x){x=parseInt(x,10);return isNaN(x)?0:x})}
function natCmp(a,b){var x=natKey(a),y=natKey(b);for(var i=0;i<Math.max(x.length,y.length);i++){var d=(x[i]||0)-(y[i]||0);if(d)return d}return String(a).localeCompare(String(b))}
function model(olt){var m=String(olt).match(/C6\d\d/);return m?m[0]:''}
function hl(text,q){
  text=String(text); if(!q) return esc(text);
  var i=text.toUpperCase().indexOf(q.toUpperCase()); if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
function copy(text,btn){
  function ok(){btn.classList.add('done');setTimeout(function(){btn.classList.remove('done')},1200);toast('Nusxalandi','ok')}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,fb)}else fb();
  function fb(){var t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){}t.remove()}
}
var ICON_COPY='<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
var ICON_SEARCH='<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
var ICON_OLT='<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01M12 7h5M12 17h5"/></svg>';
var ICON_X='<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>';

/* ---------- Shell ---------- */
function buildShell(){
  var u=S.user;
  $('who').textContent=(u.ism||'Foydalanuvchi')+' · '+(u.role==='admin'?'Admin':(DIST_NAME[u.tuman]||'Xodim'));
  var seg=$('distSeg');
  if(u.role==='admin'){
    seg.innerHTML='<button data-d="all">Hammasi</button><button data-d="buxoro">Buxoro</button><button data-d="kogon">Kogon</button>';
    show('distSeg',true);
    seg.onclick=function(e){var b=e.target.closest('button');if(!b)return;S.dist=b.dataset.d;S.olt=null;S.oltQ='';S.portQ='';render()};
  } else show('distSeg',false);
  $('modeSeg').onclick=function(e){var b=e.target.closest('button');if(!b)return;S.mode=b.dataset.m;S.olt=null;render()};
}

/* ---------- Render ---------- */
function render(){
  Array.prototype.forEach.call($('modeSeg').children,function(b){var on=b.dataset.m===S.mode;b.classList.toggle('on',on);b.classList.toggle('acc',on)});
  Array.prototype.forEach.call($('distSeg').children,function(b){var on=b.dataset.d===S.dist;b.classList.toggle('on',on);b.classList.toggle('acc',on)});
  var rows=scoped(), olts={};
  rows.forEach(function(r){olts[r.olt]=1});
  var st='<span class="chip"><b>'+rows.length+'</b> ONU</span><span class="chip"><b>'+Object.keys(olts).length+'</b> OLT</span>';
  st+= S.updatedAt?'<span class="chip tag">Baza: '+esc(S.updatedAt)+'</span>':'<span class="chip warn">Baza hali yuklanmagan</span>';
  $('stats').innerHTML=st;
  if(S.mode==='serial') renderSerial(rows); else if(S.olt) renderOlt(rows); else renderOltList(rows);
  window.scrollTo(0,0);
}

function searchHTML(id,ph,val,inputmode){
  return '<div class="searchbox">'+ICON_SEARCH+'<input class="input" id="'+id+'" placeholder="'+ph+'" value="'+esc(val)+'" autocomplete="off" autocapitalize="characters" spellcheck="false" '+(inputmode?'inputmode="'+inputmode+'"':'')+'>'+
    (val?'<button class="clear" data-clear="'+id+'" aria-label="Tozalash">'+ICON_X+'</button>':'')+'</div>';
}
function bindSearch(id,key,cb){
  var el=$(id); if(!el) return;
  el.addEventListener('input',function(){S[key]=el.value;var pos=el.selectionStart;cb();var n=$(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}});
  var c=document.querySelector('[data-clear="'+id+'"]'); if(c) c.onclick=function(){S[key]='';cb();var n=$(id);if(n)n.focus()};
}

/* --- OLT list --- */
function renderOltList(rows){
  var map={}; rows.forEach(function(r){(map[r.olt]=map[r.olt]||[]).push(r)});
  var names=Object.keys(map).sort(function(a,b){return a.localeCompare(b)});
  $('view').innerHTML=searchHTML('qOlt','OLT nomini qidirish…',S.oltQ)+'<div id="oltList"></div>';
  bindSearch('qOlt','oltQ',function(){$('view').querySelector('#oltList').innerHTML=oltItems(names,map);bindItems();reSearchBox()});
  function reSearchBox(){var box=document.querySelector('.searchbox');var v=S.oltQ;var cl=box.querySelector('.clear');if(v&&!cl){box.insertAdjacentHTML('beforeend','<button class="clear" data-clear="qOlt" aria-label="Tozalash">'+ICON_X+'</button>');box.querySelector('.clear').onclick=function(){S.oltQ='';renderOltList(scoped())}}else if(!v&&cl)cl.remove()}
  $('oltList').innerHTML=oltItems(names,map); bindItems();
  function bindItems(){Array.prototype.forEach.call(document.querySelectorAll('.olt-item'),function(b){b.onclick=function(){S.olt=b.dataset.olt;S.portQ='';render()}})}
}
function oltItems(names,map){
  var q=S.oltQ.trim().toUpperCase();
  var list=names.filter(function(n){return !q||n.toUpperCase().indexOf(q)>=0});
  if(!list.length) return '<div class="hint">«'+esc(S.oltQ)+'» bo\'yicha OLT topilmadi</div>';
  return list.map(function(n,i){
    var m=model(n), d=map[n][0].d, ports={}; map[n].forEach(function(r){ports[r.port]=1});
    return '<button class="card olt-item" data-olt="'+esc(n)+'" style="animation-delay:'+Math.min(i*25,400)+'ms"><div class="olt-ico">'+ICON_OLT+'</div>'+
      '<div class="olt-name">'+hl(n,S.oltQ.trim())+'<small>'+Object.keys(ports).length+' ta port'+(m?' · '+m:'')+(S.dist==='all'?' · '+(d==='buxoro'?'Buxoro':'Kogon'):'')+'</small></div>'+
      '<span class="count">'+map[n].length+'</span></button>';
  }).join('');
}

/* --- OLT detail --- */
function renderOlt(rows){
  var list=rows.filter(function(r){return r.olt===S.olt});
  var ports={}; list.forEach(function(r){(ports[r.port]=ports[r.port]||[]).push(r)});
  $('view').innerHTML='<button class="back" id="backBtn"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Barcha OLT lar</button>'+
    '<div class="card olt-head"><h2>'+esc(S.olt)+'</h2><span class="chip"><b>'+list.length+'</b> ONU</span> <span class="chip"><b>'+Object.keys(ports).length+'</b> port</span>'+(model(S.olt)?' <span class="chip">'+model(S.olt)+'</span>':'')+'</div>'+
    searchHTML('qPort','Port bo\'yicha filtr (masalan 1/3)…',S.portQ)+'<div id="portList"></div>';
  $('backBtn').onclick=function(){S.olt=null;render()};
  function draw(){
    var q=S.portQ.trim(), keys=Object.keys(ports).sort(natCmp).filter(function(p){return !q||p.indexOf(q)>=0});
    $('portList').innerHTML=keys.length?keys.map(function(p,i){
      return '<div class="card port-block" style="animation-delay:'+Math.min(i*30,450)+'ms"><div class="port-head"><span>'+hl(p,q)+'</span><em>'+ports[p].length+' ta ONU</em></div>'+
        ports[p].map(devRow).join('')+'</div>';
    }).join(''):'<div class="hint">«'+esc(S.portQ)+'» porti topilmadi</div>';
    bindCopy($('portList'));
  }
  bindSearch('qPort','portQ',function(){draw();var box=document.querySelector('.searchbox'),cl=box.querySelector('.clear');if(S.portQ&&!cl){box.insertAdjacentHTML('beforeend','<button class="clear" aria-label="Tozalash">'+ICON_X+'</button>');box.querySelector('.clear').onclick=function(){S.portQ='';renderOlt(scoped())}}else if(!S.portQ&&cl)cl.remove()});
  draw();
}
function devRow(r){
  return '<div class="dev"><div class="dev-main"><div class="ser">'+esc(r.ser)+'</div><div class="dates">Aniqlangan: '+esc(r.obn)+' · Oxirgi: '+esc(r.last)+'</div></div>'+
    '<button class="copy" data-copy="'+esc(r.ser)+'" aria-label="Nusxalash">'+ICON_COPY+'</button></div>';
}
function bindCopy(root){Array.prototype.forEach.call(root.querySelectorAll('[data-copy]'),function(b){b.onclick=function(){copy(b.dataset.copy,b)}})}

/* --- Serial search --- */
function renderSerial(rows){
  $('view').innerHTML=searchHTML('qSer','Seriya raqamini kiriting…',S.serQ)+'<div id="serOut"></div>';
  function draw(){
    var raw=S.serQ.trim(), q=norm(raw), out=$('serOut');
    if(!q){out.innerHTML='<div class="hint">Qurilmaning seriya raqamini yozing.<br>Masalan: <b>HWTC3CB0759B</b></div>';return}
    if(q.length<4){out.innerHTML='<div class="hint">Kamida 4 ta belgi kiriting</div>';return}
    var found=rows.filter(function(r){return r.key.indexOf(q)>=0});
    found.sort(function(a,b){return (b.key===q)-(a.key===q)});
    if(!found.length){
      out.innerHTML='<div class="card empty"><div class="ei"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8.5 8.5l5 5M13.5 8.5l-5 5"/></svg></div><h3>Topilmadi</h3>'+
        '<p>«'+esc(raw)+'» seriya raqami bazada yo\'q.</p><p style="margin-top:8px">Baza yangilangan bo\'lishi mumkin — iltimos, bazani tekshirib ko\'ring.'+(S.updatedAt?'<br>Oxirgi yangilanish: <b>'+esc(S.updatedAt)+'</b>':'')+'</p></div>';
      return;
    }
    var shown=found.slice(0,50);
    out.innerHTML=(found.length>1?'<div class="sec-title"><span>'+found.length+' ta natija</span></div>':'')+shown.map(function(r,i){
      return '<div class="card res" style="animation-delay:'+Math.min(i*40,400)+'ms"><div class="res-top"><span class="badge"><svg viewBox="0 0 24 24" style="width:14px;height:14px"><path d="m5 12 5 5 9-10"/></svg>Topildi</span>'+
        (S.dist==='all'?'<span class="chip">'+(r.d==='buxoro'?'Buxoro tuman':'Kogon tuman')+'</span>':'')+(r.key===q?'':'<span class="chip">qisman moslik</span>')+'</div>'+
        '<div class="row2" style="margin-bottom:12px"><div class="big">'+hl(r.ser,raw)+'</div><button class="copy" data-copy="'+esc(r.ser)+'" aria-label="Nusxalash">'+ICON_COPY+'</button></div>'+
        '<dl class="kv"><dt>OLT</dt><dd><b>'+esc(r.olt)+'</b></dd><dt>Port</dt><dd><b style="font-family:var(--mono);font-size:18px">'+esc(r.port)+'</b></dd>'+
        '<dt>Aniqlangan</dt><dd>'+esc(r.obn)+'</dd><dt>Oxirgi</dt><dd>'+esc(r.last)+'</dd></dl></div>';
    }).join('')+(found.length>50?'<div class="hint">Faqat dastlabki 50 ta ko\'rsatildi. Qidiruvni aniqroq qiling.</div>':'');
    bindCopy(out);
  }
  bindSearch('qSer','serQ',function(){draw();var box=document.querySelector('.searchbox'),cl=box.querySelector('.clear');if(S.serQ&&!cl){box.insertAdjacentHTML('beforeend','<button class="clear" aria-label="Tozalash">'+ICON_X+'</button>');box.querySelector('.clear').onclick=function(){S.serQ='';renderSerial(scoped())}}else if(!S.serQ&&cl)cl.remove()});
  draw();
}

/* ---------- Admin: baza yangilash ---------- */
$('fab').onclick=openUpdate;
function closeModal(){$('modalHost').innerHTML=''}
function openUpdate(){
  var parsed=null;
  $('modalHost').innerHTML='<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true">'+
    '<h3>Bazani yangilash</h3><p>Yangi <b>.xlsx</b> faylni tanlang. Fayl ichida «Бухоро туман» va «Когон» varaqlari bo\'lishi kerak.</p>'+
    '<label class="drop" id="drop"><input type="file" id="fileIn" accept=".xlsx,.xls" hidden><svg viewBox="0 0 24 24" style="width:30px;height:30px"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg><div>Faylni tanlash uchun bosing</div><b id="fname"></b></label>'+
    '<div id="sum"></div><div class="warnbox">Diqqat: eski baza <b>to\'liq almashtiriladi</b> va o\'zgarish hamma foydalanuvchiga ta\'sir qiladi.</div>'+
    '<div class="mrow"><button class="btn btn-ghost" id="mCancel">Bekor qilish</button><button class="btn btn-primary" id="mGo" style="margin-top:0" disabled>Yuklash</button></div></div></div>';
  $('mCancel').onclick=closeModal;
  $('mbg').addEventListener('click',function(e){if(e.target.id==='mbg')closeModal()});
  $('fileIn').onchange=function(){
    var f=this.files[0]; if(!f) return;
    $('fname').textContent=f.name; $('mGo').disabled=true; parsed=null;
    $('sum').innerHTML='<div class="sum">O\'qilmoqda…</div>';
    if(typeof XLSX==='undefined'){$('sum').innerHTML='<div class="sum bad">Excel kutubxonasi yuklanmadi. Internetni tekshirib, sahifani yangilang.</div>';return}
    var rd=new FileReader();
    rd.onload=function(){
      try{parsed=parseWorkbook(rd.result);
        $('sum').innerHTML='<div class="sum"><div><span>Buxoro tuman</span><b>'+parsed.buxoro.length+' ta</b></div><div><span>Kogon tuman</span><b>'+parsed.kogon.length+' ta</b></div></div>';
        $('mGo').disabled=false;
      }catch(err){parsed=null;$('sum').innerHTML='<div class="sum bad">'+esc(err.message)+'</div>'}
    };
    rd.onerror=function(){$('sum').innerHTML='<div class="sum bad">Faylni o\'qib bo\'lmadi</div>'};
    rd.readAsArrayBuffer(f);
  };
  $('mGo').onclick=function(){
    if(!parsed) return; var b=this; b.disabled=true; b.textContent='Yuklanmoqda…'; $('mCancel').disabled=true;
    call({action:'update',buxoro:parsed.buxoro,kogon:parsed.kogon}).then(function(j){
      if(!j.ok) throw new Error(j.error||'Yangilab bo\'lmadi');
      closeModal(); toast('Baza yangilandi: '+j.buxoro+' + '+j.kogon+' ta','ok'); loadData(true);
    }).catch(function(err){
      b.disabled=false;b.textContent='Yuklash';$('mCancel').disabled=false;
      $('sum').innerHTML='<div class="sum bad">'+esc(err.message)+'</div>';
    });
  };
}
function parseWorkbook(buf){
  var wb=XLSX.read(buf,{type:'array',raw:true,cellDates:false});
  var res={buxoro:null,kogon:null};
  wb.SheetNames.forEach(function(n){
    var l=n.toLowerCase(), k=/бухор|buxor|bukhar/.test(l)?'buxoro':(/когон|kogon|kagan/.test(l)?'kogon':null);
    if(!k) return;
    if(res[k]) throw new Error('«'+n+'» varag\'i takrorlangan');
    var aoa=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
    var h=(aoa[0]||[]).slice(0,5).map(function(x){return String(x).trim().toLowerCase()});
    for(var i=0;i<5;i++) if(h[i]!==HEADERS[i].toLowerCase()) throw new Error('«'+n+'» varag\'ida sarlavhalar noto\'g\'ri. Kutilgan: '+HEADERS.join(' | '));
    var rows=[];
    for(var r=1;r<aoa.length;r++){
      var row=[]; for(var c=0;c<5;c++) row.push(String(aoa[r][c]==null?'':aoa[r][c]).trim());
      if(!row[2]&&!row[4]) continue;
      rows.push(row);
    }
    res[k]=rows;
  });
  if(!res.buxoro) throw new Error('«Бухоро туман» varag\'i topilmadi');
  if(!res.kogon) throw new Error('«Когон» varag\'i topilmadi');
  if(!res.buxoro.length&&!res.kogon.length) throw new Error('Fayl bo\'sh — ma\'lumot qatorlari yo\'q');
  return res;
}

/* ---------- Start ---------- */
(function init(){
  var saved=lsGet('pon_auth');
  if(saved){
    try{S.auth=JSON.parse(saved)}catch(e){S.auth=null}
  }
  if(S.auth&&S.auth.login&&S.auth.parol){
    call({action:'login'}).then(function(j){
      if(!j.ok){lsDel('pon_auth');S.auth=null;show('login',true);return}
      S.user=j.user; loadData();
    }).catch(function(){ loadData(); });
    show('loader',true);
  } else show('login',true);
})();
})();
</script>
