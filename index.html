<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a3a8c">
<title>Kabel barabanlari</title>
<script>try{var t=localStorage.getItem("kb_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#eef1f7;--pn:#fff;--s2:#f3f5fa;--bd:rgba(20,30,60,.1);--tx:#12162b;--dim:#6b7280;--bl:#0a4a9e;--ok:#16a34a;--wr:#d97706;--dg:#e11d48;--nav:rgba(255,255,255,.98);--sh:0 4px 18px rgba(20,40,90,.07);color-scheme:light}
html[data-theme=dark]{--bg:#0d1322;--pn:#161d30;--s2:#1e2740;--bd:rgba(255,255,255,.1);--tx:#e8ecf7;--dim:#93a0bd;--bl:#4d8dff;--ok:#4ade80;--wr:#fbbf24;--dg:#fb7185;--nav:rgba(22,29,48,.98);--sh:0 4px 18px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14.5px/1.4 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
h3,.logo b{font-family:"Space Grotesk",Inter,sans-serif}
button,input,select{font:inherit;color:inherit}svg{display:block}
.btn{background:linear-gradient(120deg,#0a4a9e,#1f6fd1);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.sec{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}
.btn.dng{background:transparent;color:var(--dg);border:1px solid var(--dg)}
.btn.s{padding:7px 11px;font-size:13px;border-radius:10px}.btn:disabled{opacity:.55}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--pn);margin:4px 0 10px}
label{font-size:12.5px;color:var(--dim)}:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
#login{margin:auto;width:min(360px,92%);background:var(--pn);padding:28px;border-radius:22px;border:1px solid var(--bd);box-shadow:var(--sh)}
#login h3{margin:10px 0 2px;font-size:22px}#err{color:var(--dg);min-height:22px;font-size:13px}
.mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#0a3a8c,#1f6fd1);color:#fff;display:grid;place-items:center}
#app{display:none;flex:1;min-height:0;flex-direction:column}
header{background:linear-gradient(120deg,#0a2a63,#0e3f8f 55%,#1556b8);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}.logo .mark{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18)}
.logo b{font-size:17px;display:block;line-height:1.1}.logo small{opacity:.75;font-size:11.5px}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
nav{display:flex;background:var(--nav);border-bottom:1px solid var(--bd)}
nav button{flex:1;background:none;border:0;padding:7px 2px 6px;color:var(--dim);font:600 10.5px Inter,sans-serif;cursor:pointer;border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--bl);border-color:var(--bl)}
main{flex:1;min-height:0;display:flex}
.side{width:420px;overflow:auto;padding:12px;border-right:1px solid var(--bd)}
.mapw{flex:1;position:relative;min-width:0}#map{position:absolute;inset:0;z-index:0}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:9px 6px;text-align:center;box-shadow:var(--sh)}
.sum b{display:block;font:700 17px "Space Grotesk",sans-serif}.sum span{font-size:11px;color:var(--dim)}
.flt{display:flex;gap:6px}.flt>*{margin:0 0 10px;min-width:0;flex:1}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:18px;padding:13px;margin-bottom:10px;box-shadow:var(--sh)}
.card.on{border-color:var(--bl);box-shadow:0 0 0 2px var(--bl)}
.top{display:flex;align-items:center;gap:6px}.top .pill{margin-left:auto}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.pill.ok{background:rgba(22,163,74,.15);color:var(--ok)}.pill.kam{background:rgba(217,119,6,.16);color:var(--wr)}.pill.tugagan{background:rgba(225,29,72,.14);color:var(--dg)}
.bar{height:8px;background:var(--s2);border-radius:5px;margin:9px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--ok)}.bar i.kam{background:var(--wr)}.bar i.tugagan{background:var(--dg)}
.mut{color:var(--dim)}.sm{font-size:13px}.row{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.ln{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:9px 0;border-top:1px solid var(--bd);font-size:13px}.ln .row{margin:4px 0 0;justify-content:flex-end}
.warn{background:rgba(225,29,72,.1);color:var(--dg);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px}
#dbar{position:absolute;z-index:800;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--pn);border:1px solid var(--bd);border-radius:18px;padding:12px;display:none;box-shadow:var(--sh)}
#meter{font:700 24px "Space Grotesk",sans-serif}
#gps{position:absolute;z-index:700;right:10px;top:84px;width:40px;height:40px;padding:0}
#fab{position:fixed;z-index:800;right:16px;bottom:84px;width:54px;height:54px;border-radius:50%;padding:0;box-shadow:0 8px 20px rgba(10,74,158,.4);display:none}
.vx{background:#e11d48;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.ov{position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:2000}
.modal{background:var(--pn);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:22px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px}.ma{display:flex;gap:10px;margin-top:8px}.ma .btn{flex:1}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:3000;width:min(92%,380px);display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:12px;font-weight:600;font-size:13px;background:var(--pn);border:1px solid var(--bd);box-shadow:var(--sh)}.toast.err{color:var(--dg)}.toast.ok{color:var(--bl)}
@keyframes sp{to{transform:rotate(360deg)}}.spin svg{animation:sp .9s linear infinite}
.mo{display:none!important}
@media(max-width:899px){
 .side{width:100%;border:0;padding-bottom:96px}.mapw{display:none}
 body[data-t=xarita] .side{display:none}body[data-t=xarita] .mapw{display:block}
 nav{position:fixed;left:0;right:0;bottom:0;z-index:900;border-top:1px solid var(--bd);border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}
 #dbar{bottom:calc(74px + env(safe-area-inset-bottom))}.mo{display:flex!important}
}
@media(min-width:900px){#fab{bottom:24px;left:350px;right:auto}.ov{align-items:center}.modal{border-radius:20px}}
</style>
</head>
<body data-t="baraban">
<form id="login" onsubmit="doLogin();return false">
 <div class="mark" id="lm"></div><h3>Kabel barabanlari</h3><p class="mut" style="margin:0 0 16px">Hisob va xaritada kabel yo'nalishi</p>
 <label>Login<input id="lu" autocomplete="username" required></label>
 <label>Parol<input id="lp" type="password" autocomplete="current-password" required></label>
 <div id="err"></div><button class="btn" style="width:100%">Kirish</button>
</form>
<div id="ld" style="display:none;margin:auto;color:var(--dim)">Yuklanmoqda...</div>
<div id="app">
 <header><div class="logo"><div class="mark" id="hm"></div><div><b>Kabel baraban</b><small id="who"></small></div></div>
  <button id="rf" onclick="refresh(true)" title="Yangilash"></button><button id="th" onclick="theme()" title="Rejim"></button><button id="lo" onclick="logout()" title="Chiqish"></button></header>
 <nav id="nav"></nav>
 <main><div class="side" id="side"></div>
  <div class="mapw"><div id="map"></div><button id="gps" class="btn sec" onclick="locate()" title="Mening joyim"></button>
   <div id="dbar"><div id="dinfo" class="mut sm"></div><div id="meter">0 m</div>
    <div class="row"><button class="btn sec s" onclick="undo()">Orqaga</button><button class="btn sec s" onclick="clearPts()">Tozalash</button><button class="btn s" onclick="saveLine()">Saqlash</button><button class="btn dng s" onclick="stopDraw()">Bekor</button></div></div>
  </div></main>
 <button id="fab" class="btn" onclick="addD()" title="Baraban qo'shish"></button>
</div>
<div id="toasts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const API="https://script.google.com/macros/s/AKfycbxf6t1ste_nj224GGKjQWZy6bqUhCMDUQ01TbFVlnYoc0CJ78kW-WCvOo39B4gBvRX9/exec";
const IC={drum:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/>',cable:'<path d="M3 17c4 0 4-10 9-10s5 10 9 10"/><circle cx="3" cy="17" r="1.4"/><circle cx="21" cy="17" r="1.4"/>',map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',plus:'<path d="M12 5v14M5 12h14"/>',loc:'<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',ref:'<path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/>',moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',pin:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',back:'<path d="M4 12a8 8 0 1 1 3 6M4 12V7M4 12h5"/>'};
const ic=(n,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
let S=JSON.parse(localStorage.getItem("kb_s")||"null"),D={baraban:[],kabel:[],tuman:[],tarix:[],savat:[],tgerr:""},sel=null,drawing=false,ed=null,pts=[],tab="baraban",F={q:"",t:"",m:"",h:""},KF={q:"",t:"",b:"",from:"",to:""},TQ="",map,layer,me,hl,live;
const $=id=>document.getElementById(id),adm=()=>S&&S.rol=="admin";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL=["#0b6e8a","#c4410c","#6a8f1f","#8a3fa8","#b8860b","#d6336c","#2563eb","#0d9488"];
const gp=l=>l._p||(l._p=JSON.parse(l.nuqtalar));
const bd=id=>D.baraban.find(b=>b.id==id)||{},col=id=>COL[Math.max(0,D.baraban.findIndex(b=>b.id==id))%COL.length];
function fmt(s){s=String(s||"");if(/^\d{4}-\d\d-\d\dT/.test(s)){const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tashkent",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date(s)).reduce((a,x)=>(a[x.type]=x.value,a),{});return `${p.day}.${p.month}.${p.year} ${p.hour}:${p.minute}`}return s}
function tsv(s){const m=fmt(s).match(/(\d+)\.(\d+)\.(\d+) (\d+):(\d+)/);return m?new Date(+m[3],m[2]-1,+m[1],+m[4],+m[5]):new Date(0)}
function toast(m,t){const e=document.createElement("div");e.className="toast "+(t||"ok");e.textContent=m;$("toasts").appendChild(e);setTimeout(()=>e.remove(),3200)}
async function call(action,x={}){
 $("rf").classList.add("spin");
 try{const r=await fetch(API,{method:"POST",body:JSON.stringify({...x,action,u:S.u,p:S.p})});
  const j=await r.json();if(j.err){if(S.rol&&/Login yoki parol/.test(j.err))logout();throw new Error(j.err)}
  D=Object.assign(D,j);S.rol=j.rol;localStorage.setItem("kb_s",JSON.stringify(S));
  try{localStorage.setItem("kb_d",JSON.stringify({baraban:D.baraban,kabel:D.kabel,tuman:D.tuman}))}catch(e){}
  if(j.nt)fetch(API,{method:"POST",keepalive:true,body:JSON.stringify({action:"notify",nt:j.nt,u:S.u,p:S.p})}).catch(()=>{});
  return j}
 finally{$("rf").classList.remove("spin")}}
async function act(a,x,msg){try{await call(a,x);render();if(msg)toast(msg);return true}catch(e){toast(e.message,"err");return false}}
async function refresh(m){try{await call("list",{full:tab=="tarix"||tab=="savat"?1:0});render();if(m)toast("Yangilandi")}catch(e){toast(e.message,"err")}}
function modal(title,body,ok,fn){
 const o=document.createElement("div");o.className="ov";
 o.innerHTML=`<div class="modal"><h3>${title}</h3>${body}<div class="ma"><button class="btn sec" data-c>Bekor</button>${ok?`<button class="btn" data-ok>${ok}</button>`:""}</div></div>`;
 document.body.appendChild(o);const x=()=>o.remove();
 o.onclick=e=>{if(e.target==o)x()};o.querySelector("[data-c]").onclick=x;
 const b=o.querySelector("[data-ok]");
 if(b)b.onclick=async()=>{b.disabled=true;b.textContent="Saqlanmoqda...";if(await fn(o)!==false)x();else{b.disabled=false;b.textContent=ok}};
 const f=o.querySelector("input,select");f&&f.focus()}
const val=(o,n)=>o.querySelector("[name="+n+"]").value.trim();
async function doLogin(){
 S={u:$("lu").value.trim(),p:$("lp").value};$("err").textContent="Tekshirilmoqda...";
 try{await call("list");start()}catch(e){S=null;$("err").textContent=e.message}}
function logout(){localStorage.removeItem("kb_s");localStorage.removeItem("kb_d");location.reload()}
function theme(){const t=document.documentElement.dataset.theme=="dark"?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("kb_theme",t)}catch(e){}}
$("lm").innerHTML=ic("drum",24);
function start(){
 $("login").style.display="none";$("ld").style.display="none";$("app").style.display="flex";
 $("who").textContent=S.u+" · "+(adm()?"admin":"xodim");
 $("hm").innerHTML=ic("drum",20);$("rf").innerHTML=ic("ref");$("th").innerHTML=ic("moon");$("lo").innerHTML=ic("out");$("gps").innerHTML=ic("loc");$("fab").innerHTML=ic("plus",26);
 $("nav").innerHTML=[["baraban","drum","Barabanlar"],["kabel","cable","Kabellar"],["xarita","map","Xarita","mo"],["tarix","clock","Tarix","a"],["savat","trash","Savat","a"]].filter(n=>n[3]!="a"||adm()).map(n=>`<button data-t="${n[0]}" class="${n[3]=="mo"?"mo":""}">${ic(n[1],21)}<span>${n[2]}</span></button>`).join("");
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
 map=L.map("map",{maxZoom:20}).setView([39.77,64.42],11);
 const osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,maxNativeZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
 const sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:17,attribution:"Esri"});
 L.control.layers({"Xarita":osm,"Yo'ldosh":sat}).addTo(map);
 layer=L.layerGroup().addTo(map);me=L.layerGroup().addTo(map);
 map.on("click",e=>{if(drawing){pts.push([e.latlng.lat,e.latlng.lng]);paint()}});
 render();setInterval(()=>{if(!drawing&&!document.querySelector(".ov")&&document.activeElement.tagName!="INPUT")refresh()},60000)}
async function go(t){tab=t;if(t!="xarita")hl=null;if(drawing&&t!="xarita")stopDraw();document.body.dataset.t=t=="xarita"?"xarita":"baraban";render();setTimeout(()=>map.invalidateSize(),60);
 if(t=="tarix"||t=="savat")refresh()}
function st(b){return b.left<=0?["Tugagan","tugagan"]:b.left<=b.metr*.1?["Kam qoldi","kam"]:["Yetarli","ok"]}
function render(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
 $("fab").style.display=tab=="baraban"&&adm()?"flex":"none";
 const s=$("side"),opt=(a,v,all)=>`<option value="">${all}</option>`+a.map(x=>`<option ${v==x?"selected":""}>${esc(x)}</option>`).join("");
 if(tab=="tarix"){s.innerHTML=(D.tgerr?`<div class="warn"><b>Telegram xatosi:</b> ${esc(D.tgerr)}</div>`:"")+`<input placeholder="Qidirish: xodim, amal, baraban..." value="${esc(TQ)}" oninput="TQ=this.value;tarix()"><div id="lst"></div>`;tarix()}
 else if(tab=="savat"){savat()}
 else if(tab=="kabel"){
  s.innerHTML=`<div class="sum" id="ks" style="grid-template-columns:repeat(3,1fr)"></div><input placeholder="Qidirish: baraban, xodim, joy" value="${esc(KF.q)}" oninput="KF.q=this.value;kabellar()">
  <div class="flt"><select onchange="KF.t=this.value;kabellar()">${opt(D.tuman,KF.t,"Barcha tuman")}</select><select onchange="KF.b=this.value;kabellar()"><option value="">Barcha baraban</option>${D.baraban.map(b=>`<option value="${b.id}" ${KF.b==b.id?"selected":""}>№${esc(b.raqam)} ${esc(b.marka)}</option>`).join("")}</select></div>
  <div class="flt"><label>Dan<input type="date" value="${KF.from}" onchange="KF.from=this.value;kabellar()"></label><label>Gacha<input type="date" value="${KF.to}" onchange="KF.to=this.value;kabellar()"></label></div><div id="lst"></div>`;kabellar()}
 else{
  const A=D.baraban,sum=k=>Math.round(A.reduce((a,b)=>a+Number(b[k]),0));
  s.innerHTML=`<div class="sum"><div><b>${A.length}</b><span>baraban</span></div><div><b>${sum("metr")}</b><span>jami m</span></div><div><b>${sum("used")}</b><span>ishlatildi</span></div><div><b>${sum("left")}</b><span>qoldi</span></div></div>
  <input placeholder="Qidirish: raqam yoki marka" value="${esc(F.q)}" oninput="F.q=this.value;list()">
  <div class="flt"><select onchange="F.t=this.value;list()">${opt(D.tuman,F.t,"Barcha tuman")}</select><select onchange="F.m=this.value;list()">${opt([...new Set(A.map(b=>b.marka))],F.m,"Barcha marka")}</select></div>
  <select onchange="F.h=this.value;list()">${[["","Barcha holat"],["ok","Yetarli"],["kam","Kam qoldi"],["tugagan","Tugagan"]].map(o=>`<option value="${o[0]}" ${F.h==o[0]?"selected":""}>${o[1]}</option>`).join("")}</select><div id="lst"></div>`;
  list()}
 paint()}
function list(){
 const q=F.q.toLowerCase(),A=D.baraban.filter(b=>(!q||(b.raqam+" "+b.marka).toLowerCase().includes(q))&&(!F.t||b.tuman==F.t)&&(!F.m||b.marka==F.m)&&(!F.h||st(b)[1]==F.h));
 $("lst").innerHTML=A.map(card).join("")||'<p class="mut">Baraban topilmadi</p>'}
function card(b){
 const s=st(b),on=sel==b.id,pct=Math.max(0,Math.min(100,b.left/b.metr*100));
 let h=`<div class="card ${on?"on":""}" onclick="pick('${b.id}')"><div class="top"><span class="dot" style="background:${col(b.id)}"></span><b>№${esc(b.raqam)}</b><span class="mut">${esc(b.marka)}</span><span class="pill ${s[1]}">${s[0]}</span></div>
 <div class="mut sm">${esc(b.tuman)}</div><div class="bar"><i class="${s[1]}" style="width:${pct}%"></i></div>
 <div class="sm">Jami <b>${b.metr}</b> · ishlatildi <b>${b.used}</b> · qoldi <b>${b.left}</b> m</div>
 <div class="row"><button class="btn s" onclick="event.stopPropagation();draw('${b.id}')">${ic("pin",15)}Kabel chizish</button><button class="btn sec s" onclick="event.stopPropagation();showL('${b.id}')">${ic("cable",15)}Kabellar (${D.kabel.filter(l=>l.baraban==b.id).length})</button>`;
 if(adm())h+=`<button class="btn sec s" onclick="event.stopPropagation();editD('${b.id}')">${ic("edit",15)}Tahrir</button><button class="btn dng s" onclick="event.stopPropagation();delD('${b.id}')">${ic("trash",15)}</button>`;
 h+="</div>";
 return h+"</div>"}
const can=l=>adm()||l.kim==S.u,lbtn=id=>`<button class="btn sec s" onclick="event.stopPropagation();startEdit('${id}')">${ic("edit",15)}</button><button class="btn dng s" onclick="event.stopPropagation();delL('${id}')">${ic("trash",15)}</button>`;
function showL(id){KF={q:"",t:"",b:id,from:"",to:""};go("kabel")}
function kabellar(){
 const q=KF.q.toLowerCase(),a=KF.from?new Date(KF.from+"T00:00:00"):0,z=KF.to?new Date(KF.to+"T23:59:59"):0;
 const A=D.kabel.slice().reverse().filter(l=>{const b=bd(l.baraban),t=tsv(l.vaqt);return(!KF.t||b.tuman==KF.t)&&(!KF.b||l.baraban==KF.b)&&(!a||t>=a)&&(!z||t<=z)&&(!q||[b.raqam,b.marka,b.tuman,l.kim,l.izoh].join(" ").toLowerCase().includes(q))});
 $("ks").innerHTML=`<div><b>${A.length}</b><span>kabel</span></div><div><b>${Math.round(A.reduce((s,l)=>s+Number(l.metr),0)*10)/10}</b><span>jami metr</span></div><div><b>${new Set(A.map(l=>l.baraban)).size}</b><span>baraban</span></div>`;
 $("lst").innerHTML=A.map(l=>{const b=bd(l.baraban);
  return `<div class="card"><div class="top"><span class="dot" style="background:${col(l.baraban)}"></span><b>№${esc(b.raqam)}</b><span class="mut">${esc(b.tuman)}</span><b style="margin-left:auto">${l.metr} m</b></div><div class="mut sm">${fmt(l.vaqt)} · ${esc(l.kim)}</div>${l.izoh?`<div class="sm">${esc(l.izoh)}</div>`:""}<div class="row"><button class="btn s" onclick="viewLine('${l.id}')">${ic("map",15)}Xaritada ko'rish</button>${can(l)?lbtn(l.id):""}</div></div>`}).join("")||'<p class="mut">Kabel topilmadi</p>'}
function tarix(){
 const q=TQ.toLowerCase();
 $("lst").innerHTML=D.tarix.filter(h=>!q||Object.values(h).join(" ").toLowerCase().includes(q)).map(h=>`<div class="card"><span class="mut sm">${fmt(h.vaqt)} · ${esc(h.kim)}</span><br><b>${esc(h.amal)}</b><br>${esc(h.tafsilot)}</div>`).join("")||'<p class="mut">Amal topilmadi</p>'}
function savat(){
 $("side").innerHTML=`<p class="mut sm">O'chirilgan baraban va kabellar shu yerga tushadi. Tiklash mumkin.</p>`+(D.savat.map(x=>`<div class="card"><div class="top"><b>${x.tur=="baraban"?"Baraban":"Kabel"}</b></div><div class="sm">${esc(x.info)}</div><div class="mut sm">${fmt(x.vaqt)} · ${esc(x.kim)} o'chirgan</div><div class="row"><button class="btn s" onclick="rest('${x.id}')">${ic("back",15)}Tiklash</button><button class="btn dng s" onclick="purge('${x.id}')">Butunlay o'chirish</button></div></div>`).join("")||'<p class="mut">Savat bo\'sh</p>')}
const rest=id=>act("restore",{id},"Tiklandi").then(()=>refresh()),purge=id=>modal("Butunlay o'chirilsinmi?",'<p class="mut sm">Bu amalni qaytarib bo\'lmaydi.</p>',"O'chirish",async()=>{const r=await act("purge",{id},"O'chirildi");await refresh();return r||false});
function pick(id){sel=sel==id?null:id;render();if(innerWidth>=900)fit()}
function fit(){const a=D.kabel.filter(l=>!sel||l.baraban==sel).flatMap(l=>gp(l));if(a.length)map.fitBounds(a,{padding:[30,30]})}
function viewLine(id){const l=D.kabel.find(x=>x.id==id);sel=l.baraban;go("xarita");hl=id;setTimeout(()=>{map.invalidateSize();paint();map.fitBounds(gp(l),{padding:[50,50],maxZoom:18})},200)}
const dform=b=>`<label>Baraban raqami<input name="r" value="${esc(b?.raqam)}"></label><label>Marka<input name="m" value="${esc(b?.marka)}"></label><label>Kabel uzunligi (metr)<input name="l" type="number" min="1" value="${b?b.metr:""}"></label><label>Tuman<select name="t">${D.tuman.map(t=>`<option ${b&&b.tuman==t?"selected":""}>${esc(t)}</option>`).join("")}</select></label>`;
function addD(){modal("Yangi baraban",dform(),"Qo'shish",async o=>await act("addDrum",{raqam:val(o,"r"),marka:val(o,"m"),metr:val(o,"l"),tuman:val(o,"t")},"Baraban qo'shildi")||false)}
function editD(id){const b=bd(id);modal("Barabanni tahrirlash",dform(b),"Saqlash",async o=>await act("editDrum",{id,raqam:val(o,"r"),marka:val(o,"m"),metr:val(o,"l"),tuman:val(o,"t")},"Saqlandi")||false)}
function delD(id){const b=bd(id),n=D.kabel.filter(l=>l.baraban==id).length;modal("Baraban №"+esc(b.raqam)+" o'chirilsinmi?",`<p class="mut sm">Baraban${n?" va uning "+n+" ta kabeli":""} savatga tushadi, keyin tiklash mumkin.</p>`,"O'chirish",async()=>{if(sel==id)sel=null;return await act("delDrum",{id},"Savatga tushdi")||false})}
function lform(m,z,mx){return `<p class="mut sm">Ko'pi bilan <b>${mx} m</b> yozish mumkin (barabanda shuncha qolgan).</p><label>Ishlatilgan uzunlik (metr)<input name="m" type="number" step="0.1" min="0.1" max="${mx}" value="${m}"></label><label>Joy yoki izoh<input name="z" value="${esc(z)}"></label>`}
const chk=(o,mx)=>{const m=Number(val(o,"m"));if(!(m>0&&m<=mx)){toast("Metr 0 dan katta va "+mx+" m dan oshmasligi kerak","err");return 0}return m};
function delL(id){map&&map.closePopup();modal("Kabel o'chirilsinmi?",'<p class="mut sm">Savatga tushadi, admin tiklay oladi.</p>',"O'chirish",async()=>await act("delLine",{id},"Savatga tushdi")||false)}
const dist=p=>{let m=0;for(let i=1;i<p.length;i++)m+=L.latLng(p[i-1]).distanceTo(L.latLng(p[i]));return m},r1=x=>Math.round(x*10)/10;
function paint(){
 if(!layer)return;layer.clearLayers();
 D.kabel.filter(l=>(!sel||l.baraban==sel)&&l.id!=ed).forEach(l=>{
  L.polyline(gp(l),{color:col(l.baraban),weight:l.id==hl?9:5,opacity:hl&&l.id!=hl?.45:1}).addTo(layer).bindPopup(`<b>${l.metr} m</b><br>${esc(l.kim)} · ${fmt(l.vaqt)}<br>${esc(l.izoh)}`+(can(l)?`<br><button onclick="startEdit('${l.id}')">Tahrir</button> <button onclick="delL('${l.id}')">O'chirish</button>`:""))});
 if(drawing){live=L.polyline(pts,{color:"#e11d48",weight:5,dashArray:"7"}).addTo(layer);
  pts.forEach((p,i)=>{const m=L.marker(p,{draggable:true,icon:L.divIcon({className:"vx",iconSize:[18,18]})}).addTo(layer);
   m.on("drag",e=>{const c=e.target.getLatLng();pts[i]=[c.lat,c.lng];live.setLatLngs(pts);meter()})});meter()}}
const meter=()=>$("meter").textContent=r1(dist(pts))+" m";
function draw(id){sel=id;const b=bd(id);
 if(b.left<=0)return toast("Bu barabanda kabel qolmagan","err");
 pts=[];ed=null;drawing=true;$("dinfo").textContent="Baraban №"+b.raqam+" · qoldi "+b.left+" m. Xaritada yo'nalish bo'ylab bosing, nuqtani surish mumkin.";
 $("dbar").style.display="block";go("xarita");drawing=true;paint();setTimeout(locate,300)}
function startEdit(id){const l=D.kabel.find(x=>x.id==id);map&&map.closePopup();sel=l.baraban;ed=id;pts=gp(l).map(p=>p.slice());drawing=true;
 $("dinfo").textContent="Kabelni tahrirlash: nuqtalarni suring yoki yangi nuqta qo'shing. Tugagach Saqlash.";$("dbar").style.display="block";go("xarita");drawing=true;
 setTimeout(()=>{map.invalidateSize();paint();map.fitBounds(pts,{padding:[60,60],maxZoom:18})},200)}
function stopDraw(){drawing=false;ed=null;pts=[];$("dbar").style.display="none";paint()}
const undo=()=>{pts.pop();paint()},clearPts=()=>{pts=[];paint()};
function saveLine(){
 if(pts.length<2)return toast("Kamida 2 ta nuqta belgilang","err");
 const auto=r1(dist(pts)),id=sel,np=pts.map(p=>[+p[0].toFixed(6),+p[1].toFixed(6)]),l=ed&&D.kabel.find(x=>x.id==ed),mx=r1(bd(id).left+(l?Number(l.metr):0)),
  old=l?JSON.stringify(gp(l)):"",moved=l&&old!=JSON.stringify(np),m0=l&&!moved?Number(l.metr):Math.min(auto,mx);
 modal(l?"Kabelni saqlash":"Kabelni saqlash",`<p class="mut sm">Xaritadan o'lchandi: <b>${auto} m</b>. Haqiqiy uzunlikni tekshiring.</p>`+lform(m0,l?l.izoh:"",mx),"Saqlash",async o=>{
  const m=chk(o,mx);if(!m)return false;
  const ok=l?await act("editLine",{id:ed,metr:m,izoh:val(o,"z"),nuqtalar:np,avto:auto},"Saqlandi"):await act("addLine",{baraban:id,nuqtalar:np,avto:auto,metr:m,izoh:val(o,"z")},"Kabel saqlandi");
  if(!ok)return false;stopDraw();go("baraban")})}
function locate(){
 if(!navigator.geolocation)return toast("Brauzer joylashuvni aniqlay olmaydi","err");
 navigator.geolocation.getCurrentPosition(p=>{const c=[p.coords.latitude,p.coords.longitude];map.setView(c,17);me.clearLayers();L.circleMarker(c,{radius:8,color:"#fff",fillColor:"#2563eb",fillOpacity:1,weight:3}).addTo(me)},
 ()=>toast("Joylashuvni aniqlab bo'lmadi. GPS ruxsatini tekshiring","err"),{enableHighAccuracy:true,timeout:8000})}
if(S){$("login").style.display="none";
 try{const c=JSON.parse(localStorage.getItem("kb_d")||"null");if(c)Object.assign(D,c)}catch(e){}
 if(D.baraban.length||D.tuman.length){start();refresh()}
 else{$("ld").style.display="block";call("list").then(start).catch(e=>{$("ld").style.display="none";$("login").style.display="";$("lu").value=S?S.u:"";$("err").textContent=/Login yoki parol/.test(e.message)?e.message:"Ulanib bo'lmadi. Qayta urinib ko'ring"})}}
</script>
</body>
</html>
