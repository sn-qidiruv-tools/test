<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kabel barabanlari</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f3f5f6;--card:#fff;--ink:#16252b;--mut:#5d6f76;--line:#d8e0e3;--acc:#0b6e8a;--warn:#c4410c}
@media(prefers-color-scheme:dark){:root{--bg:#10191d;--card:#18252a;--ink:#e6eef0;--mut:#93a6ad;--line:#2a3b42;--acc:#4cb8d6;--warn:#ff8a50}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button,input,select{font:inherit;color:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.d{background:var(--warn)}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:4px 0 10px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#login{margin:auto;width:min(340px,90%);background:var(--card);padding:22px;border-radius:12px;border:1px solid var(--line)}
#login h1{margin:0 0 14px;font-size:20px}
#app{display:none;flex:1;min-height:0;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{margin-right:auto}
nav{display:flex;gap:4px}
nav button{background:transparent;color:var(--mut);padding:7px 11px}
nav button.on{background:var(--acc);color:#fff}
main{flex:1;min-height:0;display:flex}
.side{width:380px;overflow:auto;padding:10px;border-right:1px solid var(--line)}
.mapw{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.card.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.bar{height:8px;background:var(--line);border-radius:4px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
small,.mut{color:var(--mut)}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ln{display:flex;justify-content:space-between;gap:6px;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
#dbar{position:absolute;z-index:500;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:none}
#dbar .row{margin:6px 0 0}
#meter{font-size:22px;font-weight:700}
#err{color:var(--warn);min-height:20px}
@media(max-width:899px){
 .side{width:100%;border:0}.mapw{display:none}
 body[data-t=xarita] .side{display:none}body[data-t=xarita] .mapw{display:block}
}
@media(min-width:900px){#tx{display:none}}
</style>
</head>
<body data-t="baraban">
<form id="login" onsubmit="doLogin();return false">
 <h1>Kabel barabanlari</h1>
 <label>Login<input id="lu" autocomplete="username" required></label>
 <label>Parol<input id="lp" type="password" autocomplete="current-password" required></label>
 <div id="err"></div>
 <button style="width:100%">Kirish</button>
</form>
<div id="app">
 <header><b id="who"></b>
  <nav><button data-t="baraban">Barabanlar</button><button id="tx" data-t="xarita">Xarita</button><button data-t="admin" class="adm">Baraban qo'shish</button><button data-t="tarix" class="adm">Amallar tarixi</button></nav>
  <button class="g" onclick="logout()">Chiqish</button></header>
 <main><div class="side" id="side"></div>
 <div class="mapw"><div id="map"></div>
  <div id="dbar"><div id="dinfo" class="mut"></div><div id="meter">0 m</div>
   <div class="row"><button class="g" onclick="undo()">Orqaga</button><button class="g" onclick="clearPts()">Tozalash</button><button onclick="saveLine()">Saqlash</button><button class="g" onclick="stopDraw()">Bekor qilish</button></div></div>
 </div></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const API="https://script.google.com/macros/s/AKfycbxf6t1ste_nj224GGKjQWZy6bqUhCMDUQ01TbFVlnYoc0CJ78kW-WCvOo39B4gBvRX9/exec";
let S=JSON.parse(sessionStorage.s||"null"),D={baraban:[],kabel:[],tuman:[],tarix:[]},sel=null,drawing=false,pts=[],tab="baraban";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL=["#0b6e8a","#c4410c","#6a8f1f","#8a3fa8","#b8860b","#d6336c"];
async function call(action,x={}){
 const r=await fetch(API,{method:"POST",body:JSON.stringify({...x,action,u:S.u,p:S.p})});
 const j=await r.json(); if(j.err)throw new Error(j.err); D=j; S.rol=j.rol; sessionStorage.s=JSON.stringify(S); return j;
}
async function act(a,x){try{await call(a,x);render();return true}catch(e){alert(e.message);return false}}
async function doLogin(){
 S={u:$("lu").value.trim(),p:$("lp").value};$("err").textContent="Tekshirilmoqda...";
 try{await call("list");start()}catch(e){S=null;$("err").textContent=e.message}
 return false}
function logout(){sessionStorage.clear();location.reload()}
let map,layer,tiles;
function start(){
 $("login").style.display="none";$("app").style.display="flex";
 $("who").textContent=S.u+" ("+(S.rol=="admin"?"admin":"xodim")+")";
 document.querySelectorAll(".adm").forEach(b=>b.style.display=S.rol=="admin"?"":"none");
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
 map=L.map("map").setView([41.3,69.27],11);
 const osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
 const sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Esri"});
 L.control.layers({"Xarita":osm,"Yo'ldosh":sat}).addTo(map);
 layer=L.layerGroup().addTo(map);
 map.on("click",e=>{if(drawing){pts.push([e.latlng.lat,e.latlng.lng]);paint()}});
 render()}
function go(t){tab=t;if(drawing&&t!="xarita")stopDraw();document.body.dataset.t=t=="xarita"?"xarita":"baraban";
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));
 render();setTimeout(()=>map.invalidateSize(),50)}
function render(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
 const s=$("side");
 if(tab=="admin")s.innerHTML=adminHtml();
 else if(tab=="tarix")s.innerHTML=D.tarix.map(h=>`<div class="card"><small>${esc(h.vaqt)} · ${esc(h.kim)}</small><br><b>${esc(h.amal)}</b><br>${esc(h.tafsilot)}</div>`).join("")||"<p class=mut>Hali amal yo'q</p>";
 else s.innerHTML=D.baraban.map(drumHtml).join("")||"<p class=mut>Hali baraban qo'shilmagan</p>";
 paint()}
function drumHtml(b,i){
 const pct=Math.max(0,Math.min(100,b.left/b.metr*100)),on=sel==b.id;
 let h=`<div class="card ${on?"on":""}" onclick="pick('${b.id}')"><b>№${esc(b.raqam)}</b> ${esc(b.marka)} <small>· ${esc(b.tuman)}</small>
 <div class="bar"><i style="width:${pct}%"></i></div><small>Jami ${b.metr} m · ishlatildi ${b.used} m · <b>qoldi ${b.left} m</b></small>
 <div class="row"><button onclick="event.stopPropagation();draw('${b.id}')">Kabel chizish</button></div>`;
 if(on)h+=D.kabel.filter(l=>l.baraban==b.id).map(l=>`<div class="ln"><span>${esc(l.vaqt)} · ${esc(l.kim)} ${esc(l.izoh)}</span><b>${l.metr} m</b></div>`).join("");
 return h+"</div>"}
function adminHtml(){
 return `<div class="card"><b>Yangi baraban</b><br>
 <label>Baraban raqami<input id="nr"></label><label>Marka<input id="nm"></label>
 <label>Kabel uzunligi (metr)<input id="nl" type="number" min="1"></label>
 <label>Tuman<select id="nt">${D.tuman.map(t=>`<option>${esc(t)}</option>`).join("")}</select></label>
 <button onclick="addDrum()">Baraban qo'shish</button></div>`}
async function addDrum(){if(await act("addDrum",{raqam:$("nr").value.trim(),marka:$("nm").value.trim(),metr:$("nl").value,tuman:$("nt").value}))go("baraban")}
function pick(id){sel=sel==id?null:id;render();fit()}
function fit(){const a=D.kabel.filter(l=>!sel||l.baraban==sel).flatMap(l=>JSON.parse(l.nuqtalar));if(a.length)map.fitBounds(a,{padding:[30,30]})}
function dist(p){let m=0;for(let i=1;i<p.length;i++)m+=L.latLng(p[i-1]).distanceTo(L.latLng(p[i]));return m}
function paint(){
 if(!layer)return;layer.clearLayers();
 D.kabel.filter(l=>!sel||l.baraban==sel).forEach(l=>{
  const i=D.baraban.findIndex(b=>b.id==l.baraban),can=S.rol=="admin"||l.kim==S.u;
  L.polyline(JSON.parse(l.nuqtalar),{color:COL[i%6],weight:5}).addTo(layer).bindPopup(
   `<b>${l.metr} m</b><br>${esc(l.kim)} · ${esc(l.vaqt)}<br>${esc(l.izoh)}`+(can?`<br><button onclick="editL('${l.id}',${l.metr})">O'zgartirish</button> <button class="d" onclick="delL('${l.id}')">O'chirish</button>`:""))});
 if(drawing){L.polyline(pts,{color:"#000",weight:4,dashArray:"6"}).addTo(layer);pts.forEach(p=>L.circleMarker(p,{radius:5,color:"#fff",fillColor:"#c4410c",fillOpacity:1}).addTo(layer));$("meter").textContent=Math.round(dist(pts)*10)/10+" m"}}
function editL(id,m){const v=prompt("Yangi uzunlik (metr):",m);if(v){map.closePopup();act("editLine",{id,metr:v})}}
function delL(id){if(confirm("Kabel o'chirilsinmi?")){map.closePopup();act("delLine",{id})}}
function draw(id){sel=id;drawing=true;pts=[];const b=D.baraban.find(x=>x.id==id);
 $("dinfo").textContent="Baraban №"+b.raqam+" · qoldi "+b.left+" m. Xaritada yo'nalish bo'ylab bosing.";
 $("dbar").style.display="block";go("xarita");drawing=true;render()}
function stopDraw(){drawing=false;pts=[];$("dbar").style.display="none";paint()}
const undo=()=>{pts.pop();paint()},clearPts=()=>{pts=[];paint()};
async function saveLine(){
 if(pts.length<2)return alert("Kamida 2 ta nuqta belgilang");
 const auto=Math.round(dist(pts)*10)/10,m=prompt("Haqiqiy ishlatilgan uzunlik (metr):",auto);if(!m)return;
 const izoh=prompt("Joy yoki izoh (ixtiyoriy):","")||"";
 if(await act("addLine",{baraban:sel,nuqtalar:pts,avto:auto,metr:m,izoh})){stopDraw();go("baraban")}}
if(S)call("list").then(start).catch(()=>{sessionStorage.clear();S=null});
</script>
</body>
</html>
