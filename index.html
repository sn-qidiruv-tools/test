async function startEdit(id){const l=D.kabel.find(x=>x.id==id);map&&map.closePopup();
 if(!gp(l)){toast("Chizma yuklanmoqda...");await needGeo([id]);if(!gp(l))return toast("Chizmani yuklab bo'lmadi. Internetni tekshiring","err")}
 dr=l.baraban;ed=id;pts=gp(l).map(p=>p.slice());pts0=JSON.stringify(pts);lastF=null;ready=false;drawing=true;mv=1;gq(null);$("gh").textContent="";
 $("dinfo").textContent="Kabelni tahrirlash";toast("Nuqtalarni suring yoki xaritaga bosib yangi nuqta qo'shing");$("dbar").style.display="block";render();
 onMap(()=>{paint();map.fitBounds(pts,{padding:[60,60],maxZoom:18})})}

const undo=()=>{pts.pop();paintD()},clearPts=()=>{pts=[];paintD()};
function saveLine(){
 if(pts.length<2)return toast("Kamida 2 ta nuqta belgilang","err");
 const sp=simplify(pts,2),np=sp.map(p=>[+p[0].toFixed(6),+p[1].toFixed(6)]),auto=Math.round(dist(sp)),id=dr,l=ed&&D.kabel.find(x=>x.id==ed),mx=Math.floor(bd(id).left+(l?Number(l.metr):0)+1e-6),
  moved=l&&JSON.stringify(pts)!=pts0,m0=l&&!moved?fm(l.metr):Math.min(auto,mx);
 modal("Kabelni saqlash",`<p class="mut sm">Xaritadan o'lchandi: <b>${auto} m</b>. Haqiqiy uzunlikni tekshiring.</p>`+lform(m0,l?l.izoh:"",mx),"Saqlash",o=>{
  const m=chk(o,mx);if(!m)return false;const z=val(o,"z");
  if(l)enq("editLine",{id:ed,metr:m,izoh:z,nuqtalar:moved?np:undefined,avto:auto},"Saqlandi");else enq("addLine",{id:uid(),baraban:id,nuqtalar:np,avto:auto,metr:m,izoh:z},"Kabel saqlandi");
  stopDraw()})}
const xe=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function kmlOf(A){
 const k=c=>"ff"+c.slice(5,7)+c.slice(3,5)+c.slice(1,3);
 const pm=A.filter(l=>gp(l)).map(l=>{const b=bd(l.baraban),P=gp(l),a=P[0],z=P[P.length-1],d=`Baraban №${b.raqam} (${b.marka}), ${b.tuman}\nUzunlik: ${fm(l.metr)} m\nXodim: ${nm(l.kim)}\nVaqt: ${fmt(l.vaqt)}${l.izoh?"\nManzil: "+l.izoh:""}`;
  return `<Placemark><name>${xe(l.izoh||("№"+b.raqam+" · "+fm(l.metr)+" m"))}</name><description>${xe(d)}</description><Style><LineStyle><color>${k(col(l.baraban))}</color><width>4</width></LineStyle></Style><LineString><tessellate>1</tessellate><coordinates>${P.map(p=>p[1]+","+p[0]+",0").join(" ")}</coordinates></LineString></Placemark><Placemark><name>A · №${xe(b.raqam)}</name><Point><coordinates>${a[1]},${a[0]},0</coordinates></Point></Placemark><Placemark><name>B · №${xe(b.raqam)}</name><Point><coordinates>${z[1]},${z[0]},0</coordinates></Point></Placemark>`}).join("");
 return `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Kabellar</name>${pm}</Document></kml>`}
function dl(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/vnd.google-earth.kml+xml"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function exportKml(id){const l=D.kabel.find(x=>x.id==id);toast("KML tayyorlanmoqda...");await needGeo([id]);
 if(!gp(l))return toast("Chizmani yuklab bo'lmadi","err");
 const n=((l.izoh||"").trim()||"kabel-"+bd(l.baraban).raqam).replace(/[\\/:*?"<>|]/g,"").slice(0,60)||"kabel";
 dl(n+".kml",kmlOf([l]));
 try{const{j}=await api("sendKml",{name:n,kml:kmlOf([l]),n:1,m:fm(l.metr)});j.err?toast(j.err,"err"):toast("Telegramga yuborildi: "+n+".kml")}catch(e){toast("Telegramga yuborilmadi: internet yo'q","err")}}
function exportKmlAll(){
 const A=kfil();if(!A.length)return toast("Yuklab olinadigan kabel yo'q","err");
 const def="kabellar-"+fmt(new Date().toISOString()).slice(0,10);
 modal("KML fayl nomi",`<p class="mut sm">Filtrdagi ${A.length} ta kabel bitta KML faylga yoziladi, yuklab olinadi va Telegram chatga yuboriladi.</p><label>Fayl nomini yozing<input name="n" value="${def}" placeholder="Masalan: Buxoro-kabellar"></label>`,"Yuklab olish va yuborish",o=>{
  const n=val(o,"n").replace(/[\\/:*?"<>|]/g,"").trim();if(!n){toast("Fayl nomini yozing","err");return false}
  (async()=>{toast("KML tayyorlanmoqda...");await needGeo(A.map(l=>l.id));const kml=kmlOf(A);dl(n+".kml",kml);toast("Telegramga yuborilmoqda...");
  try{const{j}=await api("sendKml",{name:n,kml,n:A.length,m:Math.round(sum(A,"metr"))});j.err?toast(j.err,"err"):toast("Telegramga yuborildi ✓")}catch(e){toast("Telegramga yuborilmadi: internet yo'q","err")}})()})}
let auto=false,wid=null,lastF=null,wl=null,ready=false,pts0="";
const ACC=20,STEP=5,VMAX=12;
function gq(a){const e=$("gq");e.textContent="GPS: "+(a==null?"—":Math.round(a)+" m "+(a<=10?"(yaxshi)":a<=ACC?"(o'rtacha)":"(past)"));e.style.color=a==null?"var(--dim)":a<=10?"var(--ok)":a<=ACC?"var(--wr)":"var(--dg)"}
function showMe(c,a){if(!me)return;me.clearLayers();if(a)L.circle(c,{radius:a,color:"#2563eb",weight:1,fillOpacity:.1}).addTo(me);L.circleMarker(c,{radius:8,color:"#fff",fillColor:"#2563eb",fillOpacity:1,weight:3}).addTo(me)}
const toggleAuto=()=>auto?stopAuto():startAuto();
function startAuto(){
 if(!navigator.geolocation)return toast("Brauzer GPS'ni qo'llamaydi","err");
 auto=true;ready=false;lastF=null;$("au").textContent="⏸ To'xtat";$("gh").textContent="GPS tayyorlanmoqda: aniqlik "+ACC+" m dan yaxshi bo'lishi kutilmoqda";
 if(navigator.wakeLock)navigator.wakeLock.request("screen").then(w=>wl=w).catch(()=>{});
 wid=navigator.geolocation.watchPosition(onFix,e=>{if(e.code==1){toast("GPS ruxsati berilmagan: brauzer sozlamasidan ruxsat bering","err");stopAuto()}else $("gh").textContent=e.code==3?"GPS signali kutilmoqda...":"GPS signali topilmadi"},{enableHighAccuracy:true,maximumAge:0,timeout:15000})}
function stopAuto(){auto=false;if(wid!=null&&navigator.geolocation)navigator.geolocation.clearWatch(wid);wid=null;if(wl){wl.release().catch(()=>{});wl=null}const b=$("au");if(b)b.textContent="▶ Avto"}
function onFix(p){
 const c=[p.coords.latitude,p.coords.longitude],a=p.coords.accuracy,t=p.timestamp;gq(a);showMe(c,a);
 if(!drawing||!auto)return;
 if(!ready){if(a>ACC){$("gh").textContent="GPS tayyorlanmoqda: aniqlik "+Math.round(a)+" m, kerak ≤ "+ACC+" m. Chizish hali boshlanmadi";return}ready=true;toast("GPS tayyor: yuring")}
 if(a>ACC){$("gh").textContent="Signal past ("+Math.round(a)+" m): nuqta qo'shilmadi";return}
 if(pts.length){const d=L.latLng(pts[pts.length-1]).distanceTo(L.latLng(c));
  if(d<Math.max(STEP,a*.5))return;
  if(lastF&&d/Math.max(1,(t-lastF)/1000)>VMAX){$("gh").textContent="GPS sakrashi aniqlandi: nuqta tashlab yuborildi";return}}
 $("gh").textContent="";pts.push(c);lastF=t;paintD();map.panTo(c)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible"&&auto){toast("Sahifa orqa fonda bo'lgan: chiziqni tekshiring","err");navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wl=w).catch(()=>{})}});

 modal("Tugallanmagan chizma",`<p class="mut sm">Oxirgi chizma tugallanmagan (${d.pts.length} nuqta). Davom ettirasizmi? «Bekor» bosilsa o'chiriladi.</p>`,"Davom ettirish",()=>{dr=d.dr;ed=d.ed||null;pts=d.pts;drawing=true;mv=1;$("dinfo").textContent="Chizma tiklandi";$("dbar").style.display="block";render();onMap(()=>{paint();map.fitBounds(pts,{padding:[60,60],maxZoom:18})})},draftClear)}
function locate(){
 if(!navigator.geolocation)return toast("Brauzer joylashuvni aniqlay olmaydi","err");
 onMap(()=>navigator.geolocation.getCurrentPosition(p=>{const c=[p.coords.latitude,p.coords.longitude];map.setView(c,17);showMe(c,p.coords.accuracy)},
 ()=>toast("Joylashuvni aniqlab bo'lmadi. GPS ruxsatini tekshiring","err"),{enableHighAccuracy:true,timeout:8000}))}
if(S){$("login").style.display="none";$("splash").style.display="flex";$("spm").innerHTML=ic("drum",36);
 const t0=Date.now(),hideSp=()=>setTimeout(()=>{const e=$("splash");if(!e)return;e.classList.add("out");setTimeout(()=>e.remove(),600)},Math.max(0,3000-(Date.now()-t0)));
 if(D.baraban.length||D.tuman.length){start();refresh();hideSp()}
 else api("list").then(({j})=>{if(j.err)throw new Error(j.err);D=Object.assign(D,j);cache();start();hideSp()}).catch(e=>{$("splash").remove();$("login").style.display="";$("lu").value=S.u;$("err").textContent=/Login yoki parol/.test(e.message)?e.message:"Ulanib bo'lmadi. Qayta urinib ko'ring"})}
