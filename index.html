function tumanCards(){return D.tuman.map(t=>{const L2=D.baraban.filter(b=>b.tuman==t);
 return `<div class="card"><div class="top"><span class="dot" style="background:${TC[t]}"></span><b>${esc(t)}</b><span class="mut" style="margin-left:auto">${L2.length} baraban · qoldi <b>${fm(sum(L2,"left"))} m</b></span></div>${L2.map(b=>`<div class="ev"><b>№${esc(b.raqam)}</b> ${esc(b.marka)} <span class="pill ${st(b)[1]}">${st(b)[0]}</span><span style="float:right">${fm(b.left)} / ${fm(b.metr)} m</span></div>`).join("")||'<p class="mut sm">Baraban yo\'q</p>'}</div>`}).join("")}
function vPan(s){
 const A=D.baraban,act=A.filter(b=>!isFin(b)),G=(f)=>{const m={};A.forEach(b=>{const k=f(b);m[k]=(m[k]||0)+1});return m},by=(k,v,src=A)=>Object.entries(src.reduce((m,b)=>(m[b[k]]=(m[b[k]]||0)+b[v],m),{})).sort((a,b)=>b[1]-a[1]);
 const us={};D.kabel.forEach(l=>us[l.kim]=(us[l.kim]||0)+ +l.metr);
 const days=[];for(let i=13;i>=0;i--)days.push(fmt(new Date(Date.now()-i*864e5).toISOString()).slice(0,10));
 const dm={};D.kabel.forEach(l=>{const k=fmt(l.vaqt).slice(0,10);dm[k]=(dm[k]||0)+ +l.metr});const mxd=Math.max(1,...days.map(k=>dm[k]||0));
 const low=act.filter(b=>st(b)[1]=="kam");
 s.innerHTML=`<div class="dash"><div class="kpi">${[[act.length,"faol baraban"],[fm(sum(A,"metr")),"jami metr"],[fm(sum(A,"used")),"ishlatilgan m"],[fm(sum(A,"left")),"qolgan m"],[D.kabel.length,"tortilgan kabel"],[A.length-act.length,"tugagan baraban"]].map(k=>`<div><b>${k[0]}</b><span>${k[1]}</span></div>`).join("")}</div>
 <div class="card wide"><div class="h">Marka va tuman bo'yicha qoldiq (m)</div>${matrix()}</div>${tumanCards()}<div class="card"><div class="h">Marka bo'yicha qoldiq</div>${bars(by("marka","left"),"m")}</div>
 <div class="card"><div class="h">Tuman bo'yicha ishlatilgan</div>${bars(by("tuman","used"),"m",t=>TC[t])}</div>
 <div class="card"><div class="h">Xodimlar (tortgan kabel)</div>${bars(Object.entries(us).sort((a,b)=>b[1]-a[1]),"m")}</div>
 <div class="card wide"><div class="h">Oxirgi 14 kun (kunlik metr)</div><div class="cols">${days.map(k=>`<div class="col" title="${k}: ${fm(dm[k]||0)} m"><span>${fm(dm[k]||0)||""}</span><i style="height:${(dm[k]||0)/mxd*80}%"></i><span>${k.slice(0,5)}</span></div>`).join("")}</div></div>
 <div class="card"><div class="h">Kam qolgan barabanlar</div>${low.map(b=>`<div class="ev"><b>№${esc(b.raqam)}</b> ${esc(b.marka)} · ${esc(b.tuman)} <b style="float:right;color:var(--wr)">${fm(b.left)} m</b></div>`).join("")||'<p class="mut sm">Hammasi yetarli</p>'}</div>
 <div class="card"><div class="h">So'nggi amallar</div>${D.tarix.slice(0,8).map(h=>`<div class="ev"><span class="mut">${fmt(h.vaqt)} · ${esc(h.kim)}</span><br><b>${esc(h.amal)}</b> ${esc(h.tafsilot)}</div>`).join("")||'<p class="mut sm">Yuklanmoqda...</p>'}</div></div>`}
function viewLine(id){const l=D.kabel.find(x=>x.id==id);hl=id;mv=1;render();onMap(()=>{paint();map.fitBounds(gp(l),{padding:[50,50],maxZoom:18})})}
const dform=b=>`<label>Baraban raqami<input name="r" value="${esc(b?.raqam)}"></label><label>Marka</label><div class="pf"><span>OTAK-</span><input name="m" placeholder="6, 8, 12" value="${esc(b?b.marka.replace(/^OTAK-/i,""):"")}"></div><label>Kabel uzunligi (metr)<input name="l" type="number" min="1" step="1" value="${b?fm(b.metr):""}"></label><label>Tuman<select name="t">${D.tuman.map(t=>`<option ${b&&b.tuman==t?"selected":""}>${esc(t)}</option>`).join("")}</select></label><label>Izoh (ixtiyoriy)<input name="z" value="${esc(b?.izoh)}"></label>`;
function dget(o,b){const r=val(o,"r"),mv=val(o,"m"),m=Math.round(Number(val(o,"l")));if(!r||!mv||!(m>0)){toast("Raqam, marka va metrni kiriting","err");return null}if(b&&m<fm(b.used)){toast("Metr ishlatilgan "+fm(b.used)+" m dan kam bo'lmasin","err");return null}return{raqam:r,marka:/^[A-Za-z]/.test(mv)?mv:"OTAK-"+mv,metr:m,tuman:val(o,"t"),izoh:val(o,"z")}}
function addD(){modal("Yangi baraban",dform(),"Qo'shish",o=>{const x=dget(o);if(!x)return false;enq("addDrum",{id:uid(),...x},"Baraban qo'shildi")})}
function editD(id){const b=bd(id);modal("Barabanni tahrirlash",dform(b),"Saqlash",o=>{const x=dget(o,b);if(!x)return false;enq("editDrum",{id,...x},"Saqlandi")})}
function delD(id){const b=bd(id),n=nk(id);modal("Baraban №"+esc(b.raqam)+" o'chirilsinmi?",`<p class="mut sm">Baraban${n?" va uning "+n+" ta kabeli":""} savatga tushadi, keyin tiklash mumkin.</p>`,"O'chirish",()=>{enq("delDrum",{id,sid:uid()},"Savatga tushdi")})}
const lform=(m,z,mx)=>`<p class="mut sm">Ko'pi bilan <b>${mx} m</b> yozish mumkin (barabanda shuncha qolgan).</p><label>Ishlatilgan uzunlik (metr)<input name="m" type="number" step="1" min="1" max="${mx}" value="${m}"></label><label>Joy yoki izoh<input name="z" value="${esc(z)}"></label>`;
const chk=(o,mx)=>{const m=Math.round(Number(val(o,"m")));if(!(m>0&&m<=mx)){toast("Metr 1 dan katta va "+mx+" m dan oshmasligi kerak","err");return 0}return m};
function delL(id){map&&map.closePopup();modal("Kabel o'chirilsinmi?",'<p class="mut sm">Savatga tushadi, admin tiklay oladi.</p>',"O'chirish",()=>{enq("delLine",{id,sid:uid()},"Savatga tushdi")})}
const dist=p=>{let m=0;for(let i=1;i<p.length;i++)m+=L.latLng(p[i-1]).distanceTo(L.latLng(p[i]));return m};
function info(l){
 const b=bd(l.baraban),P=gp(l),A=P[0],B=P[P.length-1],cc=p=>p[0].toFixed(6)+", "+p[1].toFixed(6),mp=p=>`https://maps.google.com/?q=${p[0].toFixed(6)},${p[1].toFixed(6)}`;
 return `<div class="pi"><b>Kabel · baraban №${esc(b.raqam)}</b> · ${esc(b.marka)}<br><span style="color:${col(l.baraban)}">●</span> ${esc(b.tuman)}<hr>
 <div>📏 Uzunlik: <b>${fm(l.metr)} m</b>${l.avto?` (xaritadan: ${fm(l.avto)} m)`:""}</div><div>👷 Xodim: ${esc(l.kim)}</div><div>🕒 ${fmt(l.vaqt)}</div>${l.izoh?`<div>📍 Joy: ${esc(l.izoh)}</div>`:""}
 <div>🅰️ A: <a href="${mp(A)}" target="_blank" rel="noopener">${cc(A)}</a></div><div>🅱️ B: <a href="${mp(B)}" target="_blank" rel="noopener">${cc(B)}</a></div><hr>
 <div>🧵 Barabanda: jami ${fm(b.metr)} m, qoldi <b>${fm(b.left)} m</b>${b.izoh?`<br>📝 ${esc(b.izoh)}`:""}</div>
 <div class="row"><button class="btn sec s" onclick="exportKml('${l.id}')">KML</button>${can(l)?`<button class="btn sec s" onclick="startEdit('${l.id}')">Tahrirlash</button><button class="btn dng s" onclick="delL('${l.id}')">O'chirish</button>`:""}</div></div>`}
function paint(){
 if(!layer)return;layer.clearLayers();
 D.kabel.filter(l=>l.id!=ed).forEach(l=>{
  L.polyline(gp(l),{color:col(l.baraban),weight:l.id==hl?9:5,opacity:hl&&l.id!=hl?.4:1}).addTo(layer).bindPopup(info(l),{maxWidth:290})});
 if(drawing){live=L.polyline(pts,{color:"#e5384f",weight:5,dashArray:"7"}).addTo(layer);draftSave();
  pts.forEach((p,i)=>{const m=L.marker(p,{draggable:true,icon:L.divIcon({className:"vx",iconSize:[18,18]})}).addTo(layer);
   m.on("dragend",draftSave);m.on("drag",e=>{const c=e.target.getLatLng();pts[i]=[c.lat,c.lng];live.setLatLngs(pts);meter()})});meter()}}
const meter=()=>{$("meter").textContent=Math.round(dist(pts))+" m";const c=p=>p[0].toFixed(5)+", "+p[1].toFixed(5);$("ab").textContent=pts.length>1?`A: ${c(pts[0])}  ·  B: ${c(pts[pts.length-1])}`:pts.length?`A: ${c(pts[0])}`:""};
function draw(id){const b=bd(id);
 if(isFin(b))return toast("Bu barabanda kabel qolmagan","err");
 dr=id;pts=[];ed=null;lastF=null;drawing=true;mv=1;gq(null);$("gh").textContent="";$("dinfo").textContent="Baraban №"+b.raqam+" · qoldi "+fm(b.left)+" m";toast("A nuqtadan B nuqtagacha xaritada bosib boring");
 $("dbar").style.display="block";render();onMap(()=>{paint();locate()})}
function startEdit(id){const l=D.kabel.find(x=>x.id==id);map&&map.closePopup();dr=l.baraban;ed=id;pts=gp(l).map(p=>p.slice());lastF=null;drawing=true;mv=1;gq(null);$("gh").textContent="";
 $("dinfo").textContent="Kabelni tahrirlash";toast("Nuqtalarni suring yoki xaritaga bosib yangi nuqta qo'shing");$("dbar").style.display="block";render();
 onMap(()=>{paint();map.fitBounds(pts,{padding:[60,60],maxZoom:18})})}
function stopDraw(){stopAuto();draftClear();drawing=false;ed=null;pts=[];mv=0;$("dbar").style.display="none";render()}
const undo=()=>{pts.pop();paint()},clearPts=()=>{pts=[];paint()};
function saveLine(){
 if(pts.length<2)return toast("Kamida 2 ta nuqta belgilang","err");
 const auto=Math.round(dist(pts)),id=dr,np=pts.map(p=>[+p[0].toFixed(6),+p[1].toFixed(6)]),l=ed&&D.kabel.find(x=>x.id==ed),mx=Math.floor(bd(id).left+(l?Number(l.metr):0)+1e-6),
  moved=l&&JSON.stringify(gp(l))!=JSON.stringify(np),m0=l&&!moved?fm(l.metr):Math.min(auto,mx);
 modal("Kabelni saqlash",`<p class="mut sm">Xaritadan o'lchandi: <b>${auto} m</b>. Haqiqiy uzunlikni tekshiring.</p>`+lform(m0,l?l.izoh:"",mx),"Saqlash",o=>{
  const m=chk(o,mx);if(!m)return false;const z=val(o,"z");
  if(l)enq("editLine",{id:ed,metr:m,izoh:z,nuqtalar:np,avto:auto},"Saqlandi");else enq("addLine",{id:uid(),baraban:id,nuqtalar:np,avto:auto,metr:m,izoh:z},"Kabel saqlandi");
  stopDraw()})}
const xe=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function kmlOf(A){
 const k=c=>"ff"+c.slice(5,7)+c.slice(3,5)+c.slice(1,3);
 const pm=A.map(l=>{const b=bd(l.baraban),P=gp(l),a=P[0],z=P[P.length-1],d=`Baraban №${b.raqam} (${b.marka}), ${b.tuman}\nUzunlik: ${fm(l.metr)} m\nXodim: ${l.kim}\nVaqt: ${fmt(l.vaqt)}${l.izoh?"\nJoy: "+l.izoh:""}`;
  return `<Placemark><name>№${xe(b.raqam)} · ${fm(l.metr)} m</name><description>${xe(d)}</description><Style><LineStyle><color>${k(col(l.baraban))}</color><width>4</width></LineStyle></Style><LineString><tessellate>1</tessellate><coordinates>${P.map(p=>p[1]+","+p[0]+",0").join(" ")}</coordinates></LineString></Placemark><Placemark><name>A · №${xe(b.raqam)}</name><Point><coordinates>${a[1]},${a[0]},0</coordinates></Point></Placemark><Placemark><name>B · №${xe(b.raqam)}</name><Point><coordinates>${z[1]},${z[0]},0</coordinates></Point></Placemark>`}).join("");
 return `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Kabellar</name>${pm}</Document></kml>`}
function dl(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/vnd.google-earth.kml+xml"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const exportKml=id=>{const l=D.kabel.find(x=>x.id==id);dl("kabel-"+bd(l.baraban).raqam+".kml",kmlOf([l]));toast("KML yuklab olindi")};
const exportKmlAll=()=>{const A=kfil();if(!A.length)return toast("Yuklab olinadigan kabel yo'q","err");dl("kabellar.kml",kmlOf(A));toast(A.length+" ta kabel yuklab olindi")};
let auto=false,wid=null,lastF=null,wl=null;
const ACC=20,STEP=5,VMAX=12;
function gq(a){const e=$("gq");e.textContent="GPS: "+(a==null?"—":Math.round(a)+" m "+(a<=10?"(yaxshi)":a<=ACC?"(o'rtacha)":"(past)"));e.style.color=a==null?"var(--dim)":a<=10?"var(--ok)":a<=ACC?"var(--wr)":"var(--dg)"}
function showMe(c,a){if(!me)return;me.clearLayers();if(a)L.circle(c,{radius:a,color:"#2563eb",weight:1,fillOpacity:.1}).addTo(me);L.circleMarker(c,{radius:8,color:"#fff",fillColor:"#2563eb",fillOpacity:1,weight:3}).addTo(me)}
const toggleAuto=()=>auto?stopAuto():startAuto();
function startAuto(){
 if(!navigator.geolocation)return toast("Brauzer GPS'ni qo'llamaydi","err");
 auto=true;lastF=null;$("au").textContent="⏸ To'xtat";$("gh").textContent="GPS tayyorlanmoqda...";
 if(navigator.wakeLock)navigator.wakeLock.request("screen").then(w=>wl=w).catch(()=>{});
 wid=navigator.geolocation.watchPosition(onFix,e=>{if(e.code==1){toast("GPS ruxsati berilmagan: brauzer sozlamasidan ruxsat bering","err");stopAuto()}else $("gh").textContent=e.code==3?"GPS signali kutilmoqda...":"GPS signali topilmadi"},{enableHighAccuracy:true,maximumAge:0,timeout:15000})}
function stopAuto(){auto=false;if(wid!=null&&navigator.geolocation)navigator.geolocation.clearWatch(wid);wid=null;if(wl){wl.release().catch(()=>{});wl=null}const b=$("au");if(b)b.textContent="▶ Avto"}
function onFix(p){
 const c=[p.coords.latitude,p.coords.longitude],a=p.coords.accuracy,t=p.timestamp;gq(a);showMe(c,a);
 if(!drawing||!auto)return;
 if(a>ACC){$("gh").textContent="Signal past ("+Math.round(a)+" m): nuqta qo'shilmadi";return}
 if(pts.length){const d=L.latLng(pts[pts.length-1]).distanceTo(L.latLng(c));
  if(d<Math.max(STEP,a*.5))return;
  if(lastF&&d/Math.max(1,(t-lastF)/1000)>VMAX){$("gh").textContent="GPS sakrashi aniqlandi: nuqta tashlab yuborildi";return}}
 $("gh").textContent="";pts.push(c);lastF=t;paint();map.panTo(c)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible"&&auto){toast("Sahifa orqa fonda bo'lgan: chiziqni tekshiring","err");navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wl=w).catch(()=>{})}});
function draftSave(){try{localStorage.setItem("kb_draft",JSON.stringify({dr,ed,pts}))}catch(e){}}
function draftClear(){try{localStorage.removeItem("kb_draft")}catch(e){}}
function resumeDraft(){const d=J("kb_draft");if(!d||!d.pts||d.pts.length<2||!bd(d.dr).id){draftClear();return}
 modal("Tugallanmagan chizma",`<p class="mut sm">Oxirgi chizma tugallanmagan (${d.pts.length} nuqta). Davom ettirasizmi? «Bekor» bosilsa o'chiriladi.</p>`,"Davom ettirish",()=>{dr=d.dr;ed=d.ed||null;pts=d.pts;drawing=true;mv=1;$("dinfo").textContent="Chizma tiklandi";$("dbar").style.display="block";render();onMap(()=>{paint();map.fitBounds(pts,{padding:[60,60],maxZoom:18})})},draftClear)}
function locate(){
 if(!navigator.geolocation)return toast("Brauzer joylashuvni aniqlay olmaydi","err");
 onMap(()=>navigator.geolocation.getCurrentPosition(p=>{const c=[p.coords.latitude,p.coords.longitude];map.setView(c,17);showMe(c,p.coords.accuracy)},
 ()=>toast("Joylashuvni aniqlab bo'lmadi. GPS ruxsatini tekshiring","err"),{enableHighAccuracy:true,timeout:8000}))}
if(S){$("login").style.display="none";
 if(D.baraban.length||D.tuman.length){start();refresh()}
 else{$("ld").style.display="block";api("list").then(({j})=>{if(j.err)throw new Error(j.err);D=Object.assign(D,j);cache();start()}).catch(e=>{$("ld").style.display="none";$("login").style.display="";$("lu").value=S.u;$("err").textContent=/Login yoki parol/.test(e.message)?e.message:"Ulanib bo'lmadi. Qayta urinib ko'ring"})}}
</script>
